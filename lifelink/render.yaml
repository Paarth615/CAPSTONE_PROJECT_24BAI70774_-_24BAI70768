# Render Blueprint: deploys the database, the Spring Boot API and the React site in one go.
# Dashboard -> New -> Blueprint -> pick your GitHub repo.
# If a service name below is already taken on Render, change it here AND in the two URLs.
databases:
  - name: lifelink-db
    databaseName: lifelink
    user: lifelink
    plan: free

services:
  - type: web
    name: lifelink-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: lifelink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://lifelink-web.onrender.com
      - key: SEED_DEMO_DATA
        value: "true"

  - type: web
    name: lifelink-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lifelink-api.onrender.com
