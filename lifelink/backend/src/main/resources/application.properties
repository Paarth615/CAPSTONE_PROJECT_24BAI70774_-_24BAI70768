spring.application.name=lifelink
server.port=${PORT:8080}

# ---- Database: file-based H2 for local development (no install needed) ----
spring.datasource.url=jdbc:h2:file:./data/lifelink
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Security ----
# Override JWT_SECRET in production (32+ characters).
app.jwt.secret=${JWT_SECRET:lifelink-dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiry-hours=24
# Comma-separated list of front-end origins allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Smart matching ----
app.matching.cooldown-days=90

# ---- Demo data (admin, donors, requests). Only loads into an empty database. ----
app.seed.enabled=${SEED_DEMO_DATA:true}

# ---- Observability ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.pattern.level=%5p [%X{correlationId:-}]
logging.level.com.lifelink=INFO
